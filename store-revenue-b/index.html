<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<title>門市營收一覽表 改版示範</title>
<style>
html, body { margin: 0; min-height: 100%; background: #ecebe8; font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; color: #2b2b2b; }
#stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 72px; padding: 32px; box-sizing: border-box; }
#side { width: 360px; }
#side .kicker { font-size: 15px; color: #8a5a1c; font-weight: 500; }
#side h1 { margin: 8px 0 12px; font-size: 32px; line-height: 1.3; }
#side p { margin: 0 0 20px; font-size: 15px; line-height: 1.7; color: #4a4a4a; }
#side h2 { margin: 24px 0 10px; font-size: 14px; color: #5f5f5f; font-weight: 500; }
#jumps { display: flex; flex-wrap: wrap; gap: 8px; }
#jumps button, #side a.btn { height: 40px; padding: 0 14px; border: 1px solid #cfcfcf; border-radius: 4px; background: #fff; font: inherit; font-size: 14px; color: #333; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
#side a.btn { background: #c94a26; border-color: #c94a26; color: #fff; font-weight: 700; }
#side .note { margin-top: 20px; font-size: 12px; color: #6b6b6b; }
#phoneWrap { flex: none; }
#phone { width: 390px; height: 844px; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 10px #1e1e1e, 0 24px 60px rgba(0,0,0,0.28); background: #fff; position: relative; transform-origin: top left; }
@media (max-width: 860px) {
  #stage { padding: 0; display: block; }
  #side { display: none; }
  #phone { border-radius: 0; box-shadow: none; }
}
</style>
</head>
<body>
<div id="stage">
  <div id="side">
    <div class="kicker">專加科技 RMS · 手機版改版原型</div>
    <h1>門市營收一覽表</h1>
    <p>可直接點擊操作的互動原型：搜尋後條件收合並固定；圖表與表格共用同一列控制「[指標] [分組] [圖表｜表格]」；進階篩選（在結果中篩選）；點摘要修改查詢範圍。</p>
    <a class="btn" href="demo.mp4" target="_blank" rel="noopener">觀看示範影片</a>
    <h2>跳到指定畫面</h2>
    <div id="jumps">
      <button type="button" data-start="query">① 搜尋前</button>
      <button type="button" data-start="result">② 圖表</button>
      <button type="button" data-start="resultTable">③ 表格</button>
      <button type="button" data-start="metric">④ 指標（單選）</button>
      <button type="button" data-start="edit">⑤ 查詢範圍</button>
      <button type="button" data-start="filter">⑥ 進階篩選</button>
      <button type="button" data-start="dim">⑦ 分組方式</button>
    </div>
    <div class="note">＊畫面中的門市、商品與數字皆為示意資料。</div>
  </div>
  <div id="phoneWrap"><div id="phone"></div></div>
</div>
<template id="tpl">

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #ffffff; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #222222">

  <!-- 系統列 -->
  <div style="flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px; border-bottom: 1px solid #e6e6e6">
    <span style="font-size: 16px; font-weight: 500; color: #333333">專加科技 - RMS</span>
    <div style="display: flex; align-items: center; gap: 12px">
      <button type="button" style="display: flex; align-items: center; gap: 4px; height: 44px; border: 0; background: none; padding: 0; font-family: inherit; font-size: 13px; color: #444444; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>個人設定
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 4px; height: 44px; border: 0; background: none; padding: 0; font-family: inherit; font-size: 13px; color: #444444; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5"></path><path d="M10 8l-4 4 4 4M6 12h10"></path></svg>登出(28:39)
      </button>
    </div>
  </div>

  <!-- 標題列 -->
  <div style="flex: none; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; background: #6b6b6b; color: #ffffff">
    <button type="button" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: none; color: #ffffff; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <h1 style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 19px; font-weight: 500">門市營收一覽表
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg>
    </h1>
    <button type="button" aria-label="說明訊息" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: none; color: #ffffff; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="13" rx="2"></rect><path d="M8 10h8M8 14h5"></path></svg>
    </button>
  </div>

  <!-- 捲動區 -->
  <div ref="{{setScroller}}" style="flex: 1; min-height: 0; overflow-y: auto; position: relative">

    <!-- 搜尋前：完整表單直接展開 -->
    <sc-if value="{{showInlineForm}}" hint-placeholder-val="{{false}}">
      <section aria-label="查詢條件" style="padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #cfcfcf; border-radius: 4px; overflow: hidden">
          <sc-for list="{{periodOpts}}" as="p" hint-placeholder-count="3">
            <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="height: 44px; border: 0; font-family: inherit; font-size: 16px; color: #333333; cursor: pointer; {{p.css}}">{{p.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 16px">
          <span style="width: 56px; flex: none; font-size: 15px; color: #555555">日期</span>
          <sc-for list="{{dateOpts}}" as="o" hint-placeholder-count="2">
            <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; align-items: center; gap: 8px; height: 44px; border: 0; background: none; padding: 0; font-family: inherit; font-size: 15px; cursor: pointer; color: {{o.color}}">
              <span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid {{o.ring}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{o.dot}}"></span></span>
              {{o.label}}
            </button>
          </sc-for>
        </div>
        <button type="button" onClick="{{openDate}}" style="display: flex; align-items: center; justify-content: space-between; width: 260px; height: 44px; border: 0; border-bottom: 1px solid #333333; background: none; padding: 0 2px; font-family: inherit; font-size: 16px; color: #222222; cursor: pointer">{{dDateText}}
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c77a12" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        </button>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="width: 64px; flex: none; font-size: 15px; color: #555555">集團名稱</span>
          <button type="button" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 44px; border: 0; border-bottom: 1px solid #333333; background: none; padding: 0 2px; font-family: inherit; font-size: 15px; color: #222222; text-align: left; cursor: pointer">
            <span style="flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">唯賀國際餐飲股份有限公司(NU)</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="width: 64px; flex: none; font-size: 15px; color: #555555">品牌名稱</span>
          <button type="button" onClick="{{openBrand}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 44px; border: 0; border-bottom: 1px solid #333333; background: none; padding: 0 2px; font-family: inherit; font-size: 15px; color: #222222; text-align: left; cursor: pointer">
            <span style="flex: 1; min-width: 0; color: {{dBrandColor}}">{{dBrandText}}</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="width: 64px; flex: none; font-size: 15px; color: #555555">門市篩選</span>
          <button type="button" onClick="{{openStores}}" style="width: 200px; display: flex; align-items: center; gap: 8px; height: 44px; border: 0; border-bottom: 1px solid #333333; background: none; padding: 0 2px; font-family: inherit; font-size: 15px; color: #222222; text-align: left; cursor: pointer">
            <span style="flex: 1">數量：{{dStoreCount}}</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </div>

        <button type="button" onClick="{{search}}" style="margin-top: 6px; height: 48px; border: 0; border-radius: 4px; background: #c94a26; font-family: inherit; font-size: 16px; font-weight: 700; color: #ffffff; cursor: pointer">搜尋</button>
      </section>
    </sc-if>

    <!-- 搜尋後：條件摘要固定在頂端 -->
    <sc-if value="{{showResults}}" hint-placeholder-val="{{true}}">
      <button type="button" onClick="{{openQuery}}" aria-label="修改查詢範圍：{{dateText}}，{{brandText}}，門市 {{storeCount}} 間" style="position: sticky; top: 0; z-index: 5; width: 100%; height: 88px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border: 0; border-bottom: 1px solid #dcdcdc; background: #ffffff; font-family: inherit; text-align: left; cursor: pointer">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="display: flex; align-items: center; gap: 8px; font-size: 12px">
            <span style="color: #5f5f5f; font-weight: 500">查詢範圍</span>
            <span style="padding: 1px 8px; border-radius: 10px; background: #ffe3c2; color: #7a3e00; font-weight: 500">{{periodLabel}}</span>
            <span style="color: #5f5f5f">{{dateTypeLabel}}</span>
          </span>
          <span style="font-size: 17px; font-weight: 700; color: #222222; font-variant-numeric: tabular-nums">{{dateText}}</span>
          <span style="font-size: 13px; color: #5f5f5f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{brandText}} · 門市 {{storeCount}} 間</span>
        </span>
        <span aria-hidden="true" style="flex: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #f2f2f2; color: #555555">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        </span>
      </button>

      <sc-if value="{{loading}}" hint-placeholder-val="{{false}}">
        <div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 16px 16px; color: #5f5f5f; font-size: 14px">
          <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="14" fill="none" stroke="#e3e3e3" stroke-width="4"></circle><path d="M18 4a14 14 0 0 1 14 14" fill="none" stroke="#c94a26" stroke-width="4" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="0.8s" repeatCount="indefinite"></animateTransform></path></svg>
          資料載入中…
        </div>
        <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 10px; padding: 8px 16px">
          <div style="height: 120px; border-radius: 8px; background: #f0f0f0"></div>
          <div style="height: 20px; width: 60%; border-radius: 4px; background: #f3f3f3"></div>
          <div style="height: 20px; border-radius: 4px; background: #f3f3f3"></div>
          <div style="height: 20px; border-radius: 4px; background: #f3f3f3"></div>
          <div style="height: 20px; width: 80%; border-radius: 4px; background: #f3f3f3"></div>
        </div>
      </sc-if>
      <sc-if value="{{ready}}" hint-placeholder-val="{{true}}">
      <!-- 工具列＋篩選標籤（固定在摘要下方；只放不需重新搜尋的操作） -->
      <div style="position: sticky; top: 88px; z-index: 4; background: #ffffff; border-bottom: 1px solid #e3e3e3; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06)">
        <div style="display: flex; align-items: center; gap: 8px; padding: 6px 16px">
          <label style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; height: 44px; border-bottom: 1px solid #8a8a8a; color: #555555">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
            <input value="{{q}}" onChange="{{onQ}}" placeholder="過濾條件" aria-label="過濾門市" style="flex: 1; min-width: 0; border: 0; outline: none; background: none; font-family: inherit; font-size: 15px; color: #222222">
          </label>
          <button type="button" onClick="{{openFilter}}" style="flex: none; position: relative; height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 10px; border: 0; border-radius: 22px; background: {{filterBg}}; font-family: inherit; font-size: 14px; color: #333333; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7v6l-4 2v-8z"></path></svg>進階篩選
            <sc-if value="{{filtered}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #c94a26"></span>
            </sc-if>
          </button>
          <button type="button" aria-label="更多" onClick="{{openMore}}" style="flex: none; width: 44px; height: 44px; margin-right: -8px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 22px; background: none; color: #333333; cursor: pointer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
          </button>
        </div>
        <sc-if value="{{hasChips}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px">
            <sc-for list="{{chips}}" as="c" hint-placeholder-count="1">
              <button type="button" onClick="{{c.clear}}" aria-label="移除條件 {{c.label}}" style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; border: 1px solid #9fd3d6; border-radius: 18px; background: #eaf6f7; font-family: inherit; font-size: 13px; color: #145f64; cursor: pointer">{{c.label}}
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
              </button>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <sc-if value="{{isChart}}" hint-placeholder-val="{{true}}">
        <!-- 圖表模式：[指標（單選）] [分組] [圖表|表格] -->
        <div style="display: flex; align-items: center; gap: 6px; padding: 10px 16px 8px">
          <button type="button" onClick="{{openMetric}}" aria-label="指標：{{metricLabel}}，點選切換（共 28 項）" style="height: 36px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px 0 12px; border: 1px solid #26979d; border-radius: 18px; background: #f0f8f8; font-family: inherit; font-size: 15px; font-weight: 700; color: #145f64; cursor: pointer; white-space: nowrap">{{metricLabel}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
          <button type="button" onClick="{{openDim}}" aria-label="分組方式：{{dimLabel}}" style="height: 36px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px 0 12px; border: 1px solid #cfcfcf; border-radius: 18px; background: #ffffff; font-family: inherit; font-size: 15px; font-weight: 500; color: #222222; cursor: pointer; white-space: nowrap">依{{dimLabel}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
          <div role="tablist" aria-label="檢視方式" style="margin-left: auto; display: flex; border: 1px solid #cfcfcf; border-radius: 4px; overflow: hidden">
            <sc-for list="{{viewOpts}}" as="v" hint-placeholder-count="2">
              <button type="button" role="tab" aria-selected="{{v.pressed}}" onClick="{{v.pick}}" style="height: 36px; padding: 0 12px; border: 0; font-family: inherit; font-size: 14px; color: #333333; cursor: pointer; {{v.css}}">{{v.label}}</button>
            </sc-for>
          </div>
        </div>
        <section aria-label="{{metricLabel}}{{rankTitle}}" style="margin: 0 16px 14px; border: 1px solid #e3e3e3; border-radius: 8px; padding: 10px 0 10px">
          <div style="display: flex; align-items: center; gap: 2px; padding: 0 8px 0 16px">
            <h3 style="flex: 1; margin: 0; font-size: 15px; font-weight: 700; color: #222222">{{metricLabel}}</h3>
            <button type="button" aria-label="此圖表的更多操作" onClick="{{openChartMore}}" style="flex: none; width: 44px; height: 44px; margin-right: -8px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 22px; background: none; color: #444444; cursor: pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
            </button>
          </div>
          <div style="padding: 2px 16px 4px">
            <div style="font-size: 12px; color: #5f5f5f">{{totalCaption}}</div>
            <div style="font-size: 28px; line-height: 1.25; font-weight: 700; color: #222222; font-variant-numeric: tabular-nums">{{metricTotal}}</div>
          </div>
          <div style="margin: 6px 16px 2px; padding-top: 10px; border-top: 1px solid #eeeeee; font-size: 13px; color: #5f5f5f">{{rankTitle}}</div>
          <sc-for list="{{rankRows}}" as="rr" hint-placeholder-count="6">
            <div style="padding: 6px 16px">
              <div style="display: flex; align-items: baseline; gap: 8px; font-size: 14px; color: #222222">
                <span style="width: 18px; flex: none; color: #6b6b6b; font-variant-numeric: tabular-nums">{{rr.rank}}</span>
                <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{rr.name}}</span>
                <span style="font-weight: 700; font-variant-numeric: tabular-nums">{{rr.value}}</span>
              </div>
              <div style="margin: 5px 0 0 26px; height: 6px; border-radius: 3px; background: #edf1f1">
                <div style="width: {{rr.pct}}%; height: 6px; border-radius: 3px; background: #2aa5a1"></div>
              </div>
            </div>
          </sc-for>
          <sc-if value="{{noRows}}" hint-placeholder-val="{{false}}">
            <p style="margin: 0; padding: 20px 14px 10px; text-align: center; font-size: 14px; color: #5f5f5f">沒有符合條件的門市</p>
          </sc-if>
        </section>

      <!-- 圖表 -->
      <sc-for list="{{charts}}" as="ch" hint-placeholder-count="3">
        <section aria-label="{{ch.title}}" style="margin: 0 16px 14px; border: 1px solid #e3e3e3; border-radius: 8px; padding: 10px 0 12px">
          <div style="display: flex; align-items: center; gap: 2px; padding: 0 8px 0 16px">
            <h3 style="flex: 1; margin: 0; font-size: 15px; font-weight: 700; color: #222222">{{ch.title}}</h3>

<script>
class DCLogic {
  constructor(props) { this.props = props; this.state = undefined; }
  setState(p) { this.state = Object.assign({}, this.state || {}, p); render(); }
}

class Component extends DCLogic {
  S() {
    var st = this.props.start || 'query';
    var sheets = ['edit', 'stores', 'columns', 'filter', 'more', 'dim', 'metric', 'chartMore'];
    var d = {
      searched: st !== 'query',
      sheet: sheets.indexOf(st) >= 0 ? (st === 'edit' ? 'query' : st) : null,
      from: st === 'stores' ? 'query' : null,
      period: 'day', dateType: 'post', df: 4, dt: 5, brand: 'NU Pasta', loading: false,
      stores: { N001: true, N002: true, N003: true, N004: true, C001: true, C002: true, C003: true, X001: true },
      mode: 'store', showCode: false,
      cols: { rev: true, cnt: true, avg: true, void: true, voidPct: true, voidAmt: true, voidAmtPct: true, lastWeek: true },
      d: null,
      merge: true,
      groups: { '北部菜單': true, '中部菜單': true, '(未知)': true },
      conds: st === 'filter' ? [{ id: 1, m: 'rev', op: 'ge', v: '300000' }] : [],
      nextId: 2,
      q: '',
      sel: {},
      view: st === 'resultTable' ? 'table' : 'chart',
      metric: 'rev'
    };
    return Object.assign(d, this.state || {});
  }

  renderVals() {
    var self = this;
    var s = this.S();
    var set = function (p) { self.setState(p); };
    var top = function () { if (self.sc) self.sc.scrollTop = 0; };
    var fmt = function (n) { return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    var fmtI = function (n) { return n.toLocaleString('en-US'); };

    var TEAL = '#1d7f85', TEAL_FILL = '#26979d', ORANGE = '#ffbb70';
    var stores = [
      { code: 'N001', name: '門市 A', group: '北部菜單', rev: 412350, cnt: 716 },
      { code: 'N002', name: '門市 B', group: '北部菜單', rev: 368920, cnt: 645 },
      { code: 'N003', name: '門市 C', group: '北部菜單', rev: 331480, cnt: 581 },
      { code: 'N004', name: '門市 D', group: '北部菜單', rev: 297615, cnt: 522 },
      { code: 'C001', name: '門市 E', group: '中部菜單', rev: 356240, cnt: 624 },
      { code: 'C002', name: '門市 F', group: '中部菜單', rev: 288903, cnt: 509 },
      { code: 'C003', name: '門市 G', group: '中部菜單', rev: 254600, cnt: 447 },
      { code: 'X001', name: '門市 H', group: '(未知)', rev: 141600, cnt: 254 }
    ];
    var HIDDEN = 55;
    // 其他指標的示意數字（依門市固定推算）
    stores.forEach(function (x, i) {
      var r = [0.006, 0.011, 0.008, 0.013, 0.007, 0.010, 0.009, 0.012][i];
      x.void = Math.round(x.cnt * r);
      x.voidAmt = Math.round(x.void * (x.rev / x.cnt) * 0.92);
      x.lastWeek = Math.round(x.rev * [0.94, 0.97, 1.03, 0.92, 0.95, 1.01, 0.96, 0.90][i]);
    });
    var groups = ['北部菜單', '中部菜單', '(未知)'];
    var metrics = [
      { key: 'rev', label: '營業額' },
      { key: 'cnt', label: '結帳單數' },
      { key: 'avg', label: '平均訂單單價' },
      { key: 'void', label: '作廢筆數' },
      { key: 'voidPct', label: '作廢筆數佔比(%)' },
      { key: 'voidAmt', label: '作廢金額' },
      { key: 'voidAmtPct', label: '作廢金額佔比(%)' },
      { key: 'lastWeek', label: '上週同期銷售額' }
    ];
    var mLabel = {}; metrics.forEach(function (m) { mLabel[m.key] = m.label; });
    var ops = [{ key: 'eq', label: '=' }, { key: 'ne', label: '≠' }, { key: 'lt', label: '<' }, { key: 'le', label: '≤' }, { key: 'gt', label: '>' }, { key: 'ge', label: '≥' }];
    var opLabel = {}; ops.forEach(function (o) { opLabel[o.key] = o.label; });

    var radio = function (label, sel, pick) {
      return { label: label, pick: pick, pressed: sel ? 'true' : 'false',
        color: sel ? TEAL : '#333333', ring: sel ? TEAL_FILL : '#8a8a8a', dot: sel ? TEAL_FILL : 'transparent' };
    };
    var check = function (on) { return { border: on ? TEAL_FILL : '#8a8a8a', bg: on ? TEAL_FILL : '#ffffff', pressed: on ? 'true' : 'false' }; };
    var seg = function (sel, i) {
      return (sel ? 'background: ' + ORANGE + '; font-weight: 500;' : 'background: #ffffff;') + (i > 0 ? ' border-left: 1px solid #cfcfcf;' : '');
    };
    var countSel = function (obj) { return stores.filter(function (x) { return obj[x.code]; }).length; };
    var countCols = function (obj) { return 20 + metrics.filter(function (m) { return obj[m.key]; }).length; };

    // 搜尋草稿：查詢條件＋顯示設定，按「搜尋」才生效
    var D = s.d || { period: s.period, dateType: s.dateType, stores: s.stores, df: s.df, dt: s.dt, brand: s.brand };
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var rangeText = function (a, b, sep) { return '2026/11/' + pad(a) + sep + '2026/11/' + pad(b || a); };
    var setD = function (p) { set({ d: Object.assign({}, D, p) }); };

    // 資料（表格用已搜尋的設定）
    var num = function (key, o) {
      if (key === 'rev') return o.rev;
      if (key === 'cnt') return o.cnt;
      if (key === 'avg') return o.cnt ? o.rev / o.cnt : null;
      if (key === 'void') return o.void;
      if (key === 'voidPct') return o.cnt ? o.void / o.cnt * 100 : null;
      if (key === 'voidAmt') return o.voidAmt;
      if (key === 'voidAmtPct') return o.rev ? o.voidAmt / o.rev * 100 : null;
      if (key === 'lastWeek') return o.lastWeek;
      return null;
    };
    var activeConds = s.conds.filter(function (c) { return String(c.v).trim() !== '' && !isNaN(Number(String(c.v).replace(/,/g, ''))); });
    var passConds = function (x) {
      return activeConds.every(function (c) {
        var a = num(c.m, x); if (a === null) return true;
        var b = Number(String(c.v).replace(/,/g, ''));
        if (c.op === 'eq') return a === b; if (c.op === 'ne') return a !== b;
        if (c.op === 'lt') return a < b; if (c.op === 'le') return a <= b;
        if (c.op === 'gt') return a > b; return a >= b;
      });
    };
    var q = (s.q || '').trim().toLowerCase();
    var list = stores.filter(function (x) {
      return s.stores[x.code] && s.groups[x.group] && passConds(x) && (!q || x.name.toLowerCase().indexOf(q) >= 0 || x.code.toLowerCase().indexOf(q) >= 0);
    });
    var sum = function (arr) {
      var t = function (f) { return arr.reduce(function (a, b) { return a + (b[f] || 0); }, 0); };
      return { rev: t('rev'), cnt: t('cnt'), void: t('void'), voidAmt: t('voidAmt'), lastWeek: t('lastWeek') };
    };
    var tot = sum(list);
    var INTK = { cnt: 1, void: 1 }, PCTK = { voidPct: 1, voidAmtPct: 1, avg: 1 };
    var val = function (key, o) {
      var v = num(key, o); if (v === null || v === undefined) return '—';
      return INTK[key] ? fmtI(v) : fmt(v);
    };
    var kval = function (key, o) {
      var v = num(key, o); if (v === null || v === undefined) return '—';
      return PCTK[key] ? fmt(v) : fmtI(Math.round(v));
    };

  }
}

function lookup(path, scope) {
  path = path.trim();

  for (var k = 1; k < parts.length && v != null; k++) v = v[parts[k]];

}
function interp(str, scope) { return str.replace(/\{\{([^}]+)\}\}/g, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); }); }

  if (tag === 'sc-if') { return lookup(node.getAttribute('value').replace(/[{}]/g, ''), scope) ? kids(scope) : []; }
  if (tag === 'sc-for') {

    list.forEach(function (it, i) { var o = { $index: i }; o[as] = it; out = out.concat(kids(scope.concat([o]))); });
    return out;
  }
  var el = document.createElementNS(node.namespaceURI, tag), val, hasVal = false;
  Array.prototype.forEach.call(node.attributes, function (a) {
    var n = a.name, raw = RAW.exec(a.value);
    if (n.indexOf('hint-') === 0) return;
    var v = raw ? lookup(raw[1], scope) : interp(a.value, scope);
    if (n.length > 2 && n.indexOf('on') === 0) {
      if (typeof v === 'function') {
        var ev = n.slice(2); if (ev === 'change') ev = tag === 'select' ? 'change' : 'input';
        el.addEventListener(ev, v);
      }
      return;
    }
    if (n === 'ref') { if (typeof v === 'function') refs.push([v, el]); return; }
    if (n === 'value') { val = v; hasVal = true; return; }
    if (n === 'disabled') { if (v === true || v === 'true') el.setAttribute('disabled', ''); return; }
    if (n === 'data-opts') {
      (lookup(a.value, scope) || []).forEach(function (o) { var op = document.createElement('option'); op.value = o.key; op.textContent = o.label; el.appendChild(op); });
      return;
    }

}
var comp = null, tplRoot = document.getElementById('tpl').content;

function render() {
  var keep = comp.sc ? comp.sc.scrollTop : 0;
  refs = [];
  var scope = [comp.renderVals()];
  var phone = document.getElementById('phone');
  var nodes = []; tplRoot.childNodes.forEach(function (c) { nodes = nodes.concat(build(c, scope)); });
  phone.replaceChildren.apply(phone, nodes);
  refs.forEach(function (r) { r[0](r[1]); });

function fit() {
  var ph = document.getElementById('phone'), wrap = document.getElementById('phoneWrap');
  if (window.innerWidth <= 860) {
    var k = window.innerWidth / 390;
    ph.style.transform = 'scale(' + k + ')'; wrap.style.width = window.innerWidth + 'px'; wrap.style.height = (844 * k) + 'px';
  } else {
    var k2 = Math.min(1, (window.innerHeight - 64) / 844);
